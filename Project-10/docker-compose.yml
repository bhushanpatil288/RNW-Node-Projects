version: '3.8'

services:
  # MongoDB Database
  db:
    image: mongo:7-jammy
    container_name: dvd_rental_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: dvd_rental
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dvd_rental_api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_URI: mongodb://db:27017/dvd_rental
      JWT_SECRET: docker-dev-jwt-secret-change-in-production
      JWT_REFRESH_SECRET: docker-dev-refresh-secret-change-in-production
      JWT_EXPIRES_IN: 24h
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: '*'
      LOG_LEVEL: debug
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

volumes:
  mongo_data:
    driver: local
